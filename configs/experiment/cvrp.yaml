# @package _global_
# SRP Idea 4: homogeneous-fleet CVRP (cap_m = cap for all m, unit speed).
# Reuses HCVRP's decoder, conflict handler, and communication layers
# completely unchanged -- only the env/generator (parco.envs.cvrp) and
# embeddings differ, and those embeddings are literally HCVRP's own
# classes, just registered under the "cvrp" env_name.

# Override defaults: take configs from relative path
defaults:
  - override /model: parco.yaml
  - override /env: cvrp.yaml
  - override /callbacks: default.yaml
  - override /trainer: default.yaml
  - override /logger: wandb.yaml


# NOTE: other hparams are in the env file
generator_params:
  num_loc: 100 # max locs
  num_agents: 7 # min locs

# Model hyperparameters
model:
  policy: # note: all other arguments (e.g. embeddings) are automatically taken from the env
    _target_: "parco.models.policy.PARCOPolicy"
    env_name: "${env.name}"
    agent_handler: "highprob"
    embed_dim: 128
    norm_after: false # true means we use Kool structure, which seems slightly worse
    normalization: "rms"
    use_final_norm: true # LLM way
    parallel_gated_kwargs:
      mlp_activation: "silu" # use MLP as in LLaMa
    context_embedding_kwargs:
      normalization: "rms"
      norm_after: false # true means we use Kool structure, which seems slightly worse
      use_final_norm: true # LLM way
      parallel_gated_kwargs:
        mlp_activation: "silu"
  batch_size: 128
  val_batch_size: ${model.batch_size}
  test_batch_size: ${model.batch_size}
  train_data_size: 100_000
  val_data_size: 10_000
  test_data_size: 10_000
  optimizer_kwargs:
    lr: 1e-4
    weight_decay: 0.0
  lr_scheduler:
    "MultiStepLR"
  lr_scheduler_kwargs:
    milestones: [80, 95]
    gamma: 0.1
  num_augment: 8
  train_min_agents: 3
  train_max_agents: ${env.generator_params.num_agents} # max agents is the number of agents
  train_min_size: 60
  train_max_size: ${env.generator_params.num_loc} # max size is the number of locations

# Logging: we use Wandb in this case
logger:
  wandb:
    project: "parco-${env.name}"
    tags: ["parco", "${env.name}", "communication"]
    group: "${env.name}_n${env.generator_params.num_loc}_m${env.generator_params.num_agents}"
    name: "parco"

# Trainer: this is a customized version of the PyTorch Lightning trainer.
trainer:
  max_epochs: 100

seed: 1234

# Which validation metric key gets logged isn't reliable to hardcode across
# configs (seen with hcvrp_sequential and hcvrp_tanh_scaled) -- disable
# monitor-based top-k selection and rely on save_last (already True at the
# base callbacks level) for last.ckpt.
callbacks:
  model_checkpoint:
    monitor: null
