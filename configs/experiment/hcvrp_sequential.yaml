# @package _global_
# SRP Idea 1: full sequential (Full AR) decoding -- one agent committed at a
# time, zero retraining tricks, same model/architecture, only the decode
# strategy + group_size change relative to plain hcvrp.yaml.
defaults:
  - hcvrp.yaml

model:
  policy:
    train_decode_type: "group_sampling"
    val_decode_type: "group_greedy"
    test_decode_type: "group_greedy"
    group_size: 1

logger:
  wandb:
    name: "parco_sequential"

# The base hcvrp.yaml monitors a per-dataset key ("val/reward/n60_m5") that
# isn't actually being logged in this environment -- only the generic
# "val/reward" is. Watch that instead so ModelCheckpoint doesn't crash.
callbacks:
  model_checkpoint:
    monitor: "val/reward"
