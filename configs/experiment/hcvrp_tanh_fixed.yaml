# @package _global_
# SRP Idea 2: phi_fixed(z;C) = C*tanh(z) decoder-logit clipping instead of
# the default phi_scaled(z;C) = C*tanh(z/C). Full PAR train/val/test decode
# (unchanged default sampling/greedy, no group_size) -- no sequential
# decoding here.
defaults:
  - hcvrp.yaml

model:
  policy:
    tanh_clip_mode: "fixed"
    tanh_clipping: 10

logger:
  wandb:
    name: "parco_tanh_fixed_c${model.policy.tanh_clipping}"

# Which validation metric key actually gets logged (generic "val/reward" vs
# per-dataset "val/reward/n60_m5" etc.) apparently depends on the decode
# setup and isn't reliable to hardcode -- disable monitor-based top-k
# selection entirely and rely on save_last (already True at the base
# callbacks level) to always write last.ckpt regardless of what's logged.
callbacks:
  model_checkpoint:
    monitor: null
