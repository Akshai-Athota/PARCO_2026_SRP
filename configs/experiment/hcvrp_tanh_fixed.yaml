# @package _global_
# SRP Idea 2: phi_fixed(z;C) = C*tanh(z) instead of the default
# phi_scaled(z;C) = C*tanh(z/C) (used unchanged by plain hcvrp.yaml).
# Sweep C by overriding model.policy.tanh_clipping on the CLI, e.g.:
#   python train.py experiment=hcvrp_tanh_fixed model.policy.tanh_clipping=5
#   python train.py experiment=hcvrp_tanh_fixed model.policy.tanh_clipping=20
defaults:
  - hcvrp.yaml

model:
  policy:
    tanh_clip_mode: "fixed"
    tanh_clipping: 10

logger:
  wandb:
    name: "parco_tanh_fixed_c${model.policy.tanh_clipping}"
