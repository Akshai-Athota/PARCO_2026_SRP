# @package _global_
# SRP Idea 2, combined: phi_fixed(z;C)=C*tanh(z) applied to BOTH decoder
# logits AND encoder attention logits (QK^T/sqrt(d) before softmax) -- the
# most extreme point in the comparison grid, opposite of the unmodified
# baseline (plain hcvrp.yaml: scaled decoder, no attention clipping).
# Sweep C on the CLI, e.g.:
#   python train.py experiment=hcvrp_tanh_fixed_attn model.policy.tanh_clipping=5 model.policy.attn_tanh_clipping=5
defaults:
  - hcvrp.yaml

model:
  policy:
    tanh_clip_mode: "fixed"
    tanh_clipping: 10
    attn_tanh_clipping: 10
    attn_clip_mode: "fixed"

logger:
  wandb:
    name: "parco_tanh_fixed_attn_c${model.policy.tanh_clipping}"
