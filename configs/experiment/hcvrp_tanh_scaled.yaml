# @package _global_
# SRP Idea 2: explicit, clearly-labeled version of the plain baseline.
# phi_scaled(z;C) = C*tanh(z/C) on decoder logits only. Behaviorally
# IDENTICAL to unmodified hcvrp.yaml (this is already the default
# tanh_clip_mode) -- this file exists only so the run/checkpoint/wandb name
# are explicit for comparison against hcvrp_tanh_fixed, instead of relying
# on an unnamed implicit default.
defaults:
  - hcvrp.yaml

model:
  policy:
    tanh_clip_mode: "scaled"
    tanh_clipping: 10

logger:
  wandb:
    name: "parco_tanh_scaled_c${model.policy.tanh_clipping}"

# Which validation metric key actually gets logged (generic "val/reward" vs
# per-dataset "val/reward/n60_m5" etc.) apparently depends on the decode
# setup and isn't reliable to hardcode -- disable monitor-based top-k
# selection entirely and rely on save_last (already True at the base
# callbacks level) to always write last.ckpt regardless of what's logged.
callbacks:
  model_checkpoint:
    monitor: null
