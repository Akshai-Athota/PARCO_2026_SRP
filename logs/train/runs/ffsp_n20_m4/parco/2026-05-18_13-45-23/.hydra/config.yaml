mode: train
tags:
- dev
train: true
test: true
compile: false
ckpt_path: null
seed: 1234
matmul_precision: medium
metrics:
  train:
  - loss
  - reward
  val:
  - reward
  test:
  - reward
  log_on_step: true
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: epoch_{epoch:03d}
    monitor: val/max_reward
    verbose: false
    save_last: true
    save_top_k: 1
    mode: max
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: null
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 5
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
  speed_monitor:
    _target_: rl4co.utils.callbacks.speed_monitor.SpeedMonitor
    intra_step_time: true
    inter_step_time: true
    epoch_time: true
  learning_rate_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
logger:
  wandb:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    save_dir: ${paths.output_dir}
    offline: false
    id: null
    anonymous: null
    project: parco-${env.name}
    log_model: false
    prefix: ''
    group: ${env.name}_n${env.generator_params.num_job}_m${env.generator_params.num_machine}
    tags:
    - parco
    - ${env.name}
    - communication
    job_type: ''
    name: parco
trainer:
  _target_: rl4co.utils.trainer.RL4COTrainer
  default_root_dir: ${paths.output_dir}
  gradient_clip_val: 1.0
  accelerator: gpu
  precision: 16-mixed
  check_val_every_n_epoch: 1
  deterministic: false
  max_epochs: 100
  accumulate_grad_batches: 4
  devices: 1
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: true
model:
  _target_: rl4co.models.zoo.pomo.POMO
  metrics:
    train:
    - reward
    - max_reward
    val:
    - reward
    - max_reward
    test:
    - reward
    - max_reward
    log_on_step: true
  num_augment: 0
  num_starts: 24
  policy:
    _target_: parco.models.policy.PARCOMultiStagePolicy
    num_stages: ${env.generator_params.num_stage}
    env_name: ${env.name}
    agent_handler: highprob
    embed_dim: 256
    num_encoder_layers: 3
    num_heads: 16
    ms_hidden_dim: 32
    feedforward_hidden: 512
    bias: false
    normalization: instance
    use_pos_token: true
    scale_factor: 10
    init_embedding_kwargs:
      embed_dim: ${model.policy.embed_dim}
      one_hot_seed_cnt: ${env.generator_params.num_machine}
    context_embedding_kwargs:
      use_comm_layer: true
      num_heads: ${model.policy.num_heads}
      normalization: ${model.policy.normalization}
      feedforward_hidden: ${model.policy.feedforward_hidden}
      bias: ${model.policy.bias}
    dynamic_embedding_kwargs:
      embed_dim: ${model.policy.embed_dim}
      scale_factor: ${model.policy.scale_factor}
    val_decode_type: sampling
    test_decode_type: sampling
    pointer_check_nan: false
    use_decoder_mha_mask: false
    use_ham_encoder: true
  batch_size: 16
  val_batch_size: 32
  test_batch_size: 32
  train_data_size: 1000
  val_data_size: 100
  test_data_size: 1000
  optimizer_kwargs:
    lr: 0.0001
    weight_decay: 0.0
  lr_scheduler: CosineAnnealingLR
  lr_scheduler_kwargs:
    T_max: ${trainer.max_epochs}
    eta_min: 1.0e-07
env:
  _target_: parco.envs.ffsp.FFSPEnv
  name: ffsp
  generator_params:
    num_stage: 3
    num_machine: 4
    num_job: 20
