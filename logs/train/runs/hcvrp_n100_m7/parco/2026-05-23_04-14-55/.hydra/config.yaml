mode: train
tags:
- dev
train: true
test: true
compile: false
ckpt_path: null
seed: 1234
matmul_precision: medium
metrics:
  train:
  - loss
  - reward
  val:
  - reward
  test:
  - reward
  log_on_step: true
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: epoch_{epoch:03d}
    monitor: val/reward/n60_m5
    verbose: false
    save_last: true
    save_top_k: 1
    mode: max
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: null
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: 5
  rich_progress_bar:
    _target_: lightning.pytorch.callbacks.RichProgressBar
  speed_monitor:
    _target_: rl4co.utils.callbacks.speed_monitor.SpeedMonitor
    intra_step_time: true
    inter_step_time: true
    epoch_time: true
  learning_rate_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
logger:
  wandb:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    save_dir: ${paths.output_dir}
    offline: false
    id: null
    anonymous: null
    project: parco-${env.name}
    log_model: false
    prefix: ''
    group: ${env.name}_n${env.generator_params.num_loc}_m${env.generator_params.num_agents}
    tags:
    - parco
    - ${env.name}
    - communication
    job_type: ''
    name: parco
trainer:
  _target_: rl4co.utils.trainer.RL4COTrainer
  default_root_dir: ${paths.output_dir}
  gradient_clip_val: 1.0
  accelerator: gpu
  precision: 16-mixed
  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    find_unused_parameters: true
    gradient_as_bucket_view: true
  check_val_every_n_epoch: 1
  deterministic: false
  max_epochs: 100
  accumulate_grad_batches: 8
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: false
  enforce_tags: true
  print_config: true
model:
  _target_: parco.models.rl.PARCORLModule
  metrics:
    train:
    - loss
    - reward
    - halting_ratio
    - pos_ratio
    val:
    - reward
    - halting_ratio
    - pos_ratio
    test:
    - reward
    - halting_ratio
    - pos_ratio
    log_on_step: true
  policy:
    _target_: parco.models.policy.PARCOPolicy
    env_name: ${env.name}
    agent_handler: highprob
    embed_dim: 128
    norm_after: false
    normalization: rms
    use_final_norm: true
    parallel_gated_kwargs:
      mlp_activation: silu
    context_embedding_kwargs:
      normalization: rms
      norm_after: false
      use_final_norm: true
      parallel_gated_kwargs:
        mlp_activation: silu
  batch_size: 16
  val_batch_size: 16
  test_batch_size: 16
  train_data_size: 100000
  val_data_size: 10000
  test_data_size: 10000
  optimizer_kwargs:
    lr: 0.0001
    weight_decay: 0.0
  lr_scheduler: MultiStepLR
  lr_scheduler_kwargs:
    milestones:
    - 80
    - 95
    gamma: 0.1
  num_augment: 4
  train_min_agents: 3
  train_max_agents: ${env.generator_params.num_agents}
  train_min_size: 60
  train_max_size: ${env.generator_params.num_loc}
env:
  _target_: parco.envs.hcvrp.HCVRPEnv
  name: hcvrp
  generator_params:
    num_loc: 100
    num_agents: 7
  data_dir: ${paths.root_dir}/data/${env.name}
  val_file:
  - n60_m3_seed24610.npz
  - n60_m5_seed24610.npz
  - n60_m7_seed24610.npz
  - n80_m3_seed24610.npz
  - n80_m5_seed24610.npz
  - n80_m7_seed24610.npz
  - n100_m3_seed24610.npz
  - n100_m5_seed24610.npz
  - n100_m7_seed24610.npz
  val_dataloader_names:
  - n60_m3
  - n60_m5
  - n60_m7
  - n80_m3
  - n80_m5
  - n80_m7
  - n100_m3
  - n100_m5
  - n100_m7
  test_file: ${env.val_file}
  test_dataloader_names: ${env.val_dataloader_names}
generator_params:
  num_loc: 100
  num_agents: 7
